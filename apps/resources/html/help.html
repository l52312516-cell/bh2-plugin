<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; width: 920px; padding: 34px; color: #192228; background: #e8edef; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
    .header { padding: 28px 30px; border-top: 8px solid #e94b5f; background: #18272e; color: #fff; }
    .title { font-size: 38px; font-weight: 800; letter-spacing: 0; }
    .subtitle { margin-top: 10px; color: #d6e1e5; font-size: 14px; line-height: 1.6; }
    .group { margin-top: 16px; background: #fff; border: 1px solid #ccd6da; }
    .group-title { padding: 11px 16px; border-left: 5px solid #e94b5f; background: #f2f5f6; color: #263940; font-size: 18px; font-weight: 800; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .item { min-height: 78px; padding: 14px 18px; border-top: 1px solid #e1e7e9; }
    .item:nth-child(odd) { border-right: 1px solid #e1e7e9; }
    .command { color: #b4233b; font-size: 16px; font-weight: 800; overflow-wrap: anywhere; }
    .description { margin-top: 5px; color: #5a6b72; font-size: 13px; line-height: 1.5; }
    .footer { margin-top: 16px; color: #718087; text-align: right; font-size: 12px; }
  </style>
</head>
<body>
  <div class="header"><div class="title">{{title}}</div><div class="subtitle">{{subtitle}}</div></div>
  {{each groups group}}
  <section class="group">
    <div class="group-title">{{group.title}}</div>
    <div class="grid">
      {{each group.items item}}
      <div class="item"><div class="command">{{item.command}}</div><div class="description">{{item.description}}</div></div>
      {{/each}}
    </div>
  </section>
  {{/each}}
  <div class="footer">bh2-plugin · Yunzai</div>
</body>
</html>
