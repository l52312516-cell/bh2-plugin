{{if fields.length}}<section class="panel"><h2 class="section-heading">资料信息</h2><div class="fields {{if kind==='status'}}full-fields{{/if}}">{{each fields item}}<div class="field"><b>{{item.label}}</b><span>{{item.value}}</span></div>{{/each}}</div></section>{{/if}}{{if otherFields.length}}<section class="panel"><h2 class="section-heading">其他公开信息</h2><div class="fields full-fields">{{each otherFields item}}<div class="field"><b>{{item.label}}</b><span>{{item.value}}</span></div>{{/each}}</div></section>{{/if}}
