<section class="panel"><div class="profile-header"><div class="avatar">{{if profile.avatar}}<img src="{{profile.avatar}}" alt="头像" onerror="this.parentNode.classList.add('missing')"><span class="placeholder">暂无头像</span>{{else}}<img src="{{pluResPath}}ui/icons/user.svg" alt="暂无头像" style="width:58px;height:58px;object-fit:contain">{{/if}}</div><div class="profile-copy"><h2 class="profile-name">{{profile.nickname || '未知玩家'}}</h2><div class="profile-uid">UID {{uid || profile.uid || '未识别'}}</div><div class="profile-meta">{{if profile.level!=null}}Lv.{{profile.level}} · {{/if}}{{profile.region || '区服未知'}}{{if profile.guild}} · 社团 {{profile.guild}}{{/if}}{{if profile.vip!=null}} · VIP {{profile.vip}}{{/if}}</div></div></div></section>
